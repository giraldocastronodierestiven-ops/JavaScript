<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        let col;
        col = prompt('Ingrese algun color amarillo, verde, rojo');
        switch (col) {
            case 'a':
                document.write('se ingresó amarillo');
                break;
            case 'v':
                document.write('se ingresó verde');
                break;
            case 'r':
                document.write('se ingresó rojo');
                break;
        }
    </script>

</body>

</html>
