<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de JavaScript</title>
</head>
<body>

<script>
    let i = parseInt(prompt("Valor inicial:"));
    let f = parseInt(prompt("Valor final:"));
    let paso = parseInt(prompt("Paso:"));
    for (; i <= f; i += paso) {
        document.write(i + " ");
    }
</script>

</body>
</html>
