<!DOCTYPE html>
<html>

<head>
    <title>Ejemplo de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        let valor1 = '1';
        let valor2 = '1';
        let suma1 = valor1 + valor2;
        document.write('La suma como cadena: ');
        document.write(suma1);
        document.write('<br>');
        let suma2 = parseInt(valor1) + parseInt(valor2);
        document.write('La suma como enteros: ');
        document.write(suma2);
        document.write('<br>');
        let resta1 = parseInt(valor1) - parseInt(valor2);
        document.write('La resta como enteros: ');
        document.write(resta1);
        document.write('<br>');
        let division1 = parseInt(valor1) / parseInt(valor2);
        document.write('La división: ');
        document.write(division1);
        document.write('<br>');
    </script>

</body>

</html>
